packages:
  - 'packages/*'
  - 'apps/*'

# Pin the jest family pulled in by @storybook/test-runner below 30.5.0: Jest
# 30.5+ blocks the module.register() hook Storybook's importModule() uses to
# load TS config (e.g. .storybook/test-runner.ts), crashing `test:a11y` with
# "module.register() is not supported in Jest". Remove once storybookjs/storybook#36269
# is fixed upstream.
overrides:
  jest: 30.4.1
  jest-circus: 30.4.1
  jest-environment-node: 30.4.1
  jest-runtime: 30.4.1

# Supply-chain hardening (requires pnpm 10+/11).

# Don't install versions younger than this many minutes (1440 = 1 day).
minimumReleaseAge: 1440

# Trusted packages exempt from the cooldown (frequent alpha releases).
minimumReleaseAgeExclude:
  - '@spartan-ng/brain'
  - '@spartan-ng/cli'

# Transitive deps must come from the registry, not git/tarball URLs.
blockExoticSubdeps: true

# Lifecycle-script policy. Each dependency with a build script must be listed
# with an explicit decision — `true` to run it, `false` to decline it. Packages
# left undecided make pnpm fail a fresh install with ERR_PNPM_IGNORED_BUILDS, so
# the `false` entries below are required, not redundant.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  less: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  '@bundled-es-modules/glob': false
  style-dictionary: true
  sharp: true
  '@swc/core': true
  unrs-resolver: true
