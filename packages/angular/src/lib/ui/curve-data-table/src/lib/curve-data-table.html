@if (searchColumn() || hasColumnFilter()) {
<div hlmDataTableToolbar>
  @if (searchColumn()) {
  <div hlmInputGroup class="curve-data-table-search">
    <div hlmInputGroupAddon>
      <ng-icon name="phosphorMagnifyingGlass" aria-hidden="true" />
    </div>
    <input
      hlmInputGroupInput
      [attr.aria-label]="`Search ${searchColumn()}`"
      [placeholder]="`Search ${searchColumn()}...`"
      [value]="appFilter()"
      (input)="setAppFilter($event)"
    />
  </div>
  } @if (hasColumnFilter()) {
  <button
    hlmBtn
    variant="outline"
    class="curve-data-table-columns-button"
    [hlmDropdownMenuTrigger]="columnsMenu"
  >
    Columns
  </button>
  <ng-template #columnsMenu>
    <hlm-dropdown-menu class="curve-data-table-columns-menu">
      @for (column of hideableColumns(); track column.id) {
      <button
        hlmDropdownMenuCheckbox
        class="curve-data-table-column-toggle"
        [checked]="column.getIsVisible()"
        (triggered)="column.toggleVisibility(!column.getIsVisible())"
      >
        {{ column.id }}
        <hlm-dropdown-menu-checkbox-indicator />
      </button>
      }
    </hlm-dropdown-menu>
  </ng-template>
  }
</div>
}
<hlm-data-table-content [table]="table" [columns]="tanstackColumns" />
<hlm-data-table-pagination [table]="table" />
